name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boardmatch
          POSTGRES_PASSWORD: boardmatch
          POSTGRES_DB: boardmatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boardmatch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      # Real Postgres service container above — used by the dedicated
      # Postgres migration/repository steps below, in addition to (not
      # instead of) the default SQLite-based test run.
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://boardmatch:boardmatch@localhost:5432/boardmatch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Run tests
        run: python -m pytest --tb=short -q

      - name: Alembic upgrade against real Postgres
        env:
          DATABASE_URL: ${{ env.POSTGRES_TEST_DATABASE_URL }}
        run: alembic -c alembic.ini upgrade head

      - name: Run repository contract tests against real Postgres
        env:
          TEST_DATABASE_URL: ${{ env.POSTGRES_TEST_DATABASE_URL }}
        run: python -m pytest tests/repositories/ --tb=short -q

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
