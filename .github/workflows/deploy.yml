name: Deploy

on:
  push:
    branches: [main]

env:
  RELEASE_SHA: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check . --select E9,F63,F7,F82

      - name: Run tests
        run: python -m pytest --tb=short -q

  migrate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        run: |
          echo "Running migrations for release ${{ env.RELEASE_SHA }}"
          python -m boardmatch.infrastructure.db.migrations

  deploy-staging:
    runs-on: ubuntu-latest
    needs: migrate
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying release ${{ env.RELEASE_SHA }} to staging"
          echo "RELEASE_SHA=${{ env.RELEASE_SHA }}" >> "$GITHUB_ENV"
          # Deploy command placeholder — replace with actual deployment script
          # e.g., docker build, push, and deploy to staging infrastructure

      - name: Verify staging deployment
        run: |
          echo "Verifying staging deployment for release ${{ env.RELEASE_SHA }}"
          # Placeholder for health check against staging endpoint

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying release ${{ env.RELEASE_SHA }} to production"
          echo "RELEASE_SHA=${{ env.RELEASE_SHA }}" >> "$GITHUB_ENV"
          # Deploy command placeholder — replace with actual deployment script

      - name: Verify production deployment
        run: |
          echo "Verifying production deployment for release ${{ env.RELEASE_SHA }}"
          # Placeholder for health check against production endpoint

      - name: Tag release
        run: |
          echo "Production deployment complete: ${{ env.RELEASE_SHA }}"
