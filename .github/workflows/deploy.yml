name: Deploy

on:
  push:
    branches: [main]

env:
  RELEASE_SHA: ${{ github.sha }}
  # Fully-qualified image reference used by every job below. Requires the
  # `ACR_LOGIN_SERVER` repository variable (see docs/deployment.md), e.g.
  # "boardmatchacr.azurecr.io".
  IMAGE_REPO: ${{ vars.ACR_LOGIN_SERVER }}/boardmatch
  IMAGE_TAG: ${{ github.sha }}

# ==============================================================================
# Required secrets/variables — see docs/deployment.md for the full reference.
# ==============================================================================
# Repository-level (shared by build-and-push, which runs before any
# environment is selected):
#   secrets.AZURE_CREDENTIALS   Service principal JSON (az ad sp create-for-rbac
#                               --sdk-auth) with AcrPush on the registry and
#                               Contributor (or Container Apps Contributor) on
#                               the target resource groups.
#   vars.ACR_NAME               Azure Container Registry name, e.g. "boardmatchacr".
#   vars.ACR_LOGIN_SERVER        Registry login server, e.g. "boardmatchacr.azurecr.io".
#
# Per-environment (configured on the GitHub "staging"/"production"
# Environments so they are scoped and require the environment's approval
# gate to be read):
#   secrets.DATABASE_URL         Postgres connection string for that environment.
#   vars.RESOURCE_GROUP          Resource group containing the Container App.
#   vars.CONTAINER_APP_NAME      Container App name for that environment.
#   vars.HEALTH_CHECK_URL        Public base URL of that environment's app,
#                                 e.g. "https://boardmatch-staging.<region>.azurecontainerapps.io".
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Run tests
        run: python -m pytest --tb=short -q

  # ----------------------------------------------------------------------------
  # Build the hardened production Dockerfile once and push a SHA-tagged image
  # to Azure Container Registry. Both environments below deploy this exact
  # image (never rebuilt), so staging and production always run identical
  # bits.
  # ----------------------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build production image
        run: |
          docker build \
            --target production \
            --tag "${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}" \
            --tag "${{ env.IMAGE_REPO }}:latest" \
            .

      - name: Push image to ACR
        run: |
          docker push "${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}"
          docker push "${{ env.IMAGE_REPO }}:latest"

  # ----------------------------------------------------------------------------
  # Apply Alembic migrations against the staging database before the staging
  # deploy. DATABASE_URL is read from the "staging" GitHub Environment's
  # secrets — never hardcoded here.
  # ----------------------------------------------------------------------------
  migrate-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations (staging)
        run: |
          echo "Running migrations for release ${{ env.RELEASE_SHA }}"
          python -m boardmatch.infrastructure.db.migrations

  # ----------------------------------------------------------------------------
  # Deploy to Azure Container Apps.
  #
  # Why Container Apps over App Service for Containers: BoardMatch is a
  # stateless FastAPI container (all state lives in Postgres/Blob Storage per
  # the DB-persistence and Blob Storage work already on main), so it doesn't
  # need App Service's VM-based always-on instance model. Container Apps
  # gives us serverless/consumption scaling, built-in revision management
  # (every deploy is a new, independently addressable revision), and native
  # `az containerapp update --image` / `az containerapp revision` commands
  # that make the rollback step below a simple one-liner instead of a custom
  # slot-swap script.
  # ----------------------------------------------------------------------------
  deploy-staging:
    runs-on: ubuntu-latest
    needs: migrate-staging
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Record currently-deployed image (for rollback)
        id: previous
        run: |
          previous_image=$(az containerapp show \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "properties.template.containers[0].image" -o tsv)
          echo "image=${previous_image}" >> "$GITHUB_OUTPUT"
          echo "Current staging image before this deploy: ${previous_image}"

      - name: Deploy to staging
        run: |
          echo "Deploying release ${{ env.RELEASE_SHA }} to staging"
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}"

      - name: Smoke test staging /health/ready
        id: smoke_test
        continue-on-error: true
        run: |
          url="${{ vars.HEALTH_CHECK_URL }}/health/ready"
          echo "Polling ${url}"
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 5 "$url"; then
              echo "Staging is healthy (attempt ${attempt})"
              exit 0
            fi
            echo "Attempt ${attempt} failed, retrying in 10s..."
            sleep 10
          done
          echo "Staging did not become healthy in time" >&2
          exit 1

      - name: Roll back staging deployment
        if: steps.smoke_test.outcome == 'failure'
        run: |
          echo "Smoke test failed — rolling back staging to ${{ steps.previous.outputs.image }}"
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "${{ steps.previous.outputs.image }}"

      - name: Fail job after failed smoke test
        if: steps.smoke_test.outcome == 'failure'
        run: |
          echo "Staging deployment rolled back due to failed smoke test." >&2
          exit 1

  # ----------------------------------------------------------------------------
  # Apply Alembic migrations against the production database before the
  # production deploy. DATABASE_URL is read from the "production" GitHub
  # Environment's secrets — never hardcoded here.
  # ----------------------------------------------------------------------------
  migrate-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations (production)
        run: |
          echo "Running migrations for release ${{ env.RELEASE_SHA }}"
          python -m boardmatch.infrastructure.db.migrations

  deploy-production:
    runs-on: ubuntu-latest
    needs: migrate-production
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Record currently-deployed image (for rollback)
        id: previous
        run: |
          previous_image=$(az containerapp show \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "properties.template.containers[0].image" -o tsv)
          echo "image=${previous_image}" >> "$GITHUB_OUTPUT"
          echo "Current production image before this deploy: ${previous_image}"

      - name: Deploy to production
        run: |
          echo "Deploying release ${{ env.RELEASE_SHA }} to production"
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}"

      - name: Smoke test production /health/ready
        id: smoke_test
        continue-on-error: true
        run: |
          url="${{ vars.HEALTH_CHECK_URL }}/health/ready"
          echo "Polling ${url}"
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 5 "$url"; then
              echo "Production is healthy (attempt ${attempt})"
              exit 0
            fi
            echo "Attempt ${attempt} failed, retrying in 10s..."
            sleep 10
          done
          echo "Production did not become healthy in time" >&2
          exit 1

      - name: Roll back production deployment
        if: steps.smoke_test.outcome == 'failure'
        run: |
          echo "Smoke test failed — rolling back production to ${{ steps.previous.outputs.image }}"
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "${{ steps.previous.outputs.image }}"

      - name: Fail job after failed smoke test
        if: steps.smoke_test.outcome == 'failure'
        run: |
          echo "Production deployment rolled back due to failed smoke test." >&2
          exit 1

      - name: Tag release
        if: steps.smoke_test.outcome != 'failure'
        run: |
          echo "Production deployment complete: ${{ env.RELEASE_SHA }}"
