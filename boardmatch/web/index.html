<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BoardMatch</title>
<style>
  :root { --ink:#12203a; --muted:#5b6b85; --line:#dde4ee; --accent:#0b5cd6; --paid:#0f7b4f; --error:#c0392b; --warn:#e67e22; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", system-ui, sans-serif; color:var(--ink); background:#f5f7fb; }
  header { background:var(--ink); color:#fff; padding:1.5rem 2rem; display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin:0; font-size:1.4rem; }
  header p { margin:.35rem 0 0; color:#b9c6dd; font-size:.9rem; }
  .header-user { display:flex; align-items:center; gap:.75rem; }
  .header-user span { font-size:.85rem; color:#b9c6dd; }
  .header-user button { background:transparent; border:1px solid #b9c6dd; color:#b9c6dd; border-radius:6px; padding:.35rem .7rem; cursor:pointer; font-size:.8rem; }
  main { display:grid; grid-template-columns: 1fr 360px; gap:1.5rem; padding:1.5rem 2rem; align-items:start; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:1rem 1.15rem; margin-bottom:1rem; }
  .controls { display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; margin-bottom:1rem; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:.5rem .9rem; cursor:pointer; font-size:.85rem; }
  button.secondary { background:#eef2f9; color:var(--ink); }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  label { font-size:.85rem; color:var(--muted); }
  .opp-head { display:flex; justify-content:space-between; gap:1rem; }
  .score { font-size:1.6rem; font-weight:700; }
  .badge { display:inline-block; font-size:.72rem; padding:.15rem .5rem; border-radius:999px; background:#eef2f9; color:var(--muted); margin-right:.35rem; }
  .badge.paid { background:#e3f4ec; color:var(--paid); font-weight:600; }
  .badge.expired { background:#fdecea; color:var(--error); font-weight:600; }
  .badge.unverified { background:#fff3e0; color:var(--warn); font-weight:600; }
  .meta { color:var(--muted); font-size:.85rem; margin:.35rem 0 .6rem; }
  ul { margin:.4rem 0 .4rem 1.1rem; padding:0; font-size:.87rem; }
  h3 { font-size:.95rem; margin:.8rem 0 .2rem; }
  .intro { background:#fff8e8; border-left:3px solid #e0a72b; padding:.5rem .7rem; font-size:.85rem; border-radius:0 6px 6px 0; }
  pre { white-space:pre-wrap; background:#f7f9fc; border:1px solid var(--line); border-radius:6px; padding:.75rem; font-size:.8rem; max-height:340px; overflow:auto; }
  .bar { height:10px; background:#eef2f9; border-radius:999px; overflow:hidden; }
  .bar > span { display:block; height:100%; background:var(--accent); }
  .loading { text-align:center; padding:2rem; color:var(--muted); }
  .loading::after { content:""; display:inline-block; width:1em; height:1em; border:2px solid var(--accent); border-top-color:transparent; border-radius:50%; animation:spin .6s linear infinite; margin-left:.5rem; vertical-align:middle; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .error { background:#fdecea; border:1px solid #f5c6cb; color:var(--error); border-radius:8px; padding:.75rem 1rem; font-size:.85rem; margin-bottom:1rem; }
  .error strong { display:block; margin-bottom:.25rem; }
  .empty-state { text-align:center; padding:2rem; color:var(--muted); font-size:.9rem; }
  .sign-in-form { max-width:400px; margin:4rem auto; }
  .sign-in-form input { width:100%; padding:.5rem; margin:.5rem 0; border:1px solid var(--line); border-radius:6px; font-size:.9rem; }
  .sign-in-form button { width:100%; margin-top:.75rem; }
  #auth-gate { display:none; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>BoardMatch</h1>
    <p>Surfacing the invisible market for paid board and NED seats — and coaching you through it.</p>
  </div>
  <div class="header-user" id="headerUser" style="display:none">
    <span id="userDisplay"></span>
    <button id="signOutBtn">Sign out</button>
  </div>
</header>

<!-- Sign-in gate -->
<div id="sign-in-gate">
  <div class="sign-in-form card">
    <h2 style="font-size:1.1rem;margin:0 0 .5rem">Sign in to BoardMatch</h2>
    <p class="meta">Enter your user ID to access your personalised board seat matches.</p>
    <input type="text" id="signInUserId" placeholder="User ID (e.g. jane-doe)" autocomplete="username" />
    <input type="text" id="signInDisplayName" placeholder="Display name (optional)" />
    <button id="signInBtn">Sign in</button>
    <div id="signInError" class="error" style="display:none"></div>
  </div>
</div>

<!-- Authenticated app -->
<div id="auth-gate">
<main>
  <section>
    <div class="controls card">
      <label><input type="checkbox" id="paidOnly" checked /> Paid seats only</label>
      <label>Min fee AUD <input type="number" id="minFee" value="0" min="0" step="5000" style="width:100px" /></label>
      <button id="refresh">Find my board seats</button>
    </div>
    <div id="results"><div class="loading">Loading opportunities…</div></div>
  </section>
  <aside>
    <div class="card" id="candidate"><div class="loading">Loading profile…</div></div>
    <div class="card" id="readiness"><div class="loading">Loading readiness…</div></div>
    <div class="card" id="applications"><div class="loading">Loading applications…</div></div>
  </aside>
</main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const list = (items) => items.length ? `<ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : "<p class='meta'>None</p>";

// Auth state
function getAuth() {
  const userId = localStorage.getItem("bm_user_id");
  const displayName = localStorage.getItem("bm_display_name");
  return userId ? { userId, displayName } : null;
}

function setAuth(userId, displayName) {
  localStorage.setItem("bm_user_id", userId);
  localStorage.setItem("bm_display_name", displayName || userId);
}

function clearAuth() {
  localStorage.removeItem("bm_user_id");
  localStorage.removeItem("bm_display_name");
}

function authHeaders() {
  const auth = getAuth();
  if (!auth) return {};
  return { "X-Dev-User-Id": auth.userId };
}

async function apiFetch(url, options = {}) {
  const headers = { ...authHeaders(), ...(options.headers || {}) };
  const response = await fetch(url, { ...options, headers });
  if (response.status === 401) {
    clearAuth();
    showSignIn();
    throw new Error("Authentication required. Please sign in.");
  }
  if (!response.ok) {
    const body = await response.json().catch(() => ({ detail: response.statusText }));
    throw new Error(body.detail || `API error: ${response.status}`);
  }
  return response.json();
}

function showError(containerId, message) {
  $(containerId).innerHTML = `<div class="error"><strong>Error</strong>${esc(message)}</div>`;
}

function showLoading(containerId, message) {
  $(containerId).innerHTML = `<div class="loading">${esc(message)}</div>`;
}

function showEmpty(containerId, message) {
  $(containerId).innerHTML = `<div class="empty-state">${esc(message)}</div>`;
}

// Sign-in / sign-out flow
function showSignIn() {
  $("sign-in-gate").style.display = "block";
  $("auth-gate").style.display = "none";
  $("headerUser").style.display = "none";
}

function showApp() {
  const auth = getAuth();
  $("sign-in-gate").style.display = "none";
  $("auth-gate").style.display = "block";
  $("headerUser").style.display = "flex";
  $("userDisplay").textContent = auth.displayName || auth.userId;
  loadProfile();
  loadReadiness();
  loadOpportunities();
  loadApplications();
}

$("signInBtn").addEventListener("click", async () => {
  const userId = $("signInUserId").value.trim();
  const displayName = $("signInDisplayName").value.trim();
  if (!userId) {
    $("signInError").style.display = "block";
    $("signInError").innerHTML = "<strong>Error</strong> Please enter a user ID.";
    return;
  }
  $("signInError").style.display = "none";
  setAuth(userId, displayName || userId);
  showApp();
});

$("signOutBtn").addEventListener("click", () => {
  clearAuth();
  showSignIn();
});

// Profile
async function loadProfile() {
  showLoading("candidate", "Loading profile…");
  try {
    const c = await apiFetch("/api/v1/profile");
    $("candidate").innerHTML = `<h2 style="font-size:1rem;margin:0">${esc(c.name)}</h2>
      <p class="meta">${esc(c.headline || "")}</p>
      <p class="meta">${c.years_experience || 0} years · ${esc((c.sectors || []).join(", "))}</p>
      <div>${(c.skills || []).map(s => `<span class="badge">${esc(s)}</span>`).join("")}</div>`;
  } catch (e) {
    if (e.message.includes("not found") || e.message.includes("404")) {
      showEmpty("candidate", "No profile yet. Create one via the API to get personalised results.");
    } else {
      showError("candidate", e.message);
    }
  }
}

// Readiness
async function loadReadiness() {
  showLoading("readiness", "Loading readiness…");
  try {
    const r = await apiFetch("/api/v1/readiness");
    $("readiness").innerHTML = `<h2 style="font-size:1rem;margin:0 0 .4rem">Board-readiness score</h2>
      <div class="score">${r.score}<span class="meta">/100</span></div>
      <div class="bar"><span style="width:${r.score}%"></span></div>
      <p class="meta">Credentials ${r.components.credentials}/40 · Skills ${r.components.skills}/30 · Pipeline ${r.components.pipeline_momentum}/30</p>
      <p class="meta">Scoring v${esc(r.scoring_version)}</p>
      <h3>Next actions</h3>${list(r.next_actions)}
      <h3>Pipeline by stage</h3>
      <p class="meta">${Object.entries(r.stage_counts || {}).map(([k,v]) => `${esc(k)}: ${v}`).join(" · ") || "No applications yet"}</p>`;
  } catch (e) {
    showError("readiness", e.message);
  }
}

// Opportunities
function isExpired(closesOn) {
  if (!closesOn) return false;
  const closeDate = new Date(closesOn);
  return closeDate < new Date();
}

function renderOpportunity(o) {
  const expired = isExpired(o.closes_on);
  const unverified = (o.source || "").toLowerCase().includes("unverified");
  return `<div class="card${expired ? ' expired-opp' : ''}">
    <div class="opp-head">
      <div>
        <strong>${esc(o.title)}</strong> — ${esc(o.organisation)}
        <div class="meta">${esc(o.location)} · ${esc(o.sector)} · ${esc(o.source)}${o.closes_on ? " · closes " + esc(o.closes_on) : ""}</div>
        <span class="badge ${o.remuneration === "paid" ? "paid" : ""}">${esc(o.fee_display)}</span>
        <span class="badge">${esc(o.band)}</span>
        ${expired ? '<span class="badge expired">Expired</span>' : ''}
        ${unverified ? '<span class="badge unverified">Unverified</span>' : ''}
      </div>
      <div class="score">${o.score}</div>
    </div>
    <p class="meta">${esc(o.summary)}</p>
    ${o.intro_path ? `<div class="intro"><strong>Warm path (${o.intro_path.warmth}):</strong> ${esc(o.intro_path.reason)}</div>` : ""}
    <h3>Why you fit</h3>${list(o.rationale)}
    <h3>Gaps to close</h3>${list(o.gap_actions)}
    <div style="margin-top:.6rem">
      <button class="secondary" data-apply="${esc(o.id)}">Track as applied</button>
    </div>
  </div>`;
}

async function loadOpportunities() {
  showLoading("results", "Loading opportunities…");
  try {
    const params = new URLSearchParams({
      paid_only: $("paidOnly").checked,
      min_fee_aud: $("minFee").value || 0,
      page: 1,
      page_size: 20,
      status: "all"
    });
    const data = await apiFetch("/api/v1/opportunities?" + params);
    if (!data.items || data.items.length === 0) {
      showEmpty("results", "No matching seats — try relaxing the filters.");
      return;
    }
    $("results").innerHTML = data.items.map(renderOpportunity).join("");
    document.querySelectorAll("[data-apply]").forEach(btn =>
      btn.addEventListener("click", () => createApplication(btn.dataset.apply)));
  } catch (e) {
    showError("results", e.message);
  }
}

// Applications
async function loadApplications() {
  showLoading("applications", "Loading applications…");
  try {
    const data = await apiFetch("/api/v1/applications");
    if (!data.applications || data.applications.length === 0) {
      showEmpty("applications", "No applications yet. Apply to an opportunity to get started.");
      return;
    }
    $("applications").innerHTML = `<h2 style="font-size:1rem;margin:0 0 .5rem">My Applications</h2>` +
      data.applications.map(a => `<div style="margin-bottom:.5rem;padding:.5rem;background:#f7f9fc;border-radius:6px;">
        <span class="badge">${esc(a.stage)}</span>
        <span class="meta">${esc(a.opportunity_id)}</span>
        ${a.notes ? `<p class="meta" style="margin:0">${esc(a.notes)}</p>` : ""}
      </div>`).join("");
  } catch (e) {
    showError("applications", e.message);
  }
}

async function createApplication(opportunityId) {
  try {
    await apiFetch("/api/v1/applications", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ opportunity_id: opportunityId, stage: "applied" })
    });
    loadApplications();
    loadReadiness();
  } catch (e) {
    alert("Error creating application: " + e.message);
  }
}

// Event bindings
$("refresh").addEventListener("click", loadOpportunities);

// Startup
if (getAuth()) {
  showApp();
} else {
  showSignIn();
}
</script>
</body>
</html>
